function checks(){return heading('MAINTENANCE REPORT','整理与验证','整理以保留现有玩法与数值为前提。以下结果来自当前真实项目检查；本轮清理范围和备份位置见项目清理记录。')+`<div class="split"><section class="panel"><h3>早期目录整理（历史记录）</h3><ul><li>迁移 ${Object.keys(D.migration.moved).length} 个文件（含脚本 UID）。</li><li>清理空脚本、无操作回调、过时的注释代码、临时场景与旧 QA 工程。</li><li>分离示例与测试；数据结构脚本与配置同目录，兼容数据表插件。</li><li>入口、显式引用、动态单位加载与编辑器历史路径同步更新。</li></ul><h3 style="margin-top:22px">有意保留</h3><p class="muted">可复用的单位与卡面场景、美术原稿、素材授权、模板、两个编辑器插件及正常 .godot 缓存。未在主场景中引用，不代表没有设计用途。</p></section><section class="panel"><h3>整理前发现的旧测试问题</h3><ul><li>初始牌组已扩充，旧测试仍写死 14 张。</li><li>波次已改成 5 个兽人，旧测试仍写死双兽人位置。</li><li>旧直接写速度的部署测试与当前导航系统不一致。</li></ul><p class="muted">前两项改为读取当前配置；部署保留真实寻路、避让与停止回归，退役旧测试。游戏内容没有为了测试而改回旧值。</p></section></div><section class="panel"><h3>流程回归 · ${D.checks.filter(c=>c.passed).length} / ${D.checks.length}</h3>${D.checks.map(c=>`<div class="check-row"><span>${esc(c.name)}</span><span class="badge ${c.passed?'':'amber'}">${c.passed?'通过':'需检查'}</span></div>`).join('')}</section><section class="panel"><h3>资源与路径</h3><p>Godot 加载检查：${D.resource_checks} 个资源通过。显式引用检查：${D.audit.explicit_references||0} 条；单位动态场景检查：${D.audit.unit_scene_checks||0} 项。断链 ${D.audit.missing?.length||0} 项，孤立导入元数据 ${D.audit.orphan_sidecars?.length||0} 项。</p><p class="muted">Windows 环境报告系统证书存储读取警告，与本地游戏资源检查无关。自动测试覆盖逻辑与路径，不代替所有视觉和交互场景的人工试玩。</p></section><section class="panel"><h3>备份与恢复</h3><p>历次备份与本轮源文件备份已移到项目外，路径和恢复方法见 <a href="项目清理记录.md">项目清理记录</a>。</p><p>需要恢复时，将 ZIP 解压到<b>另一个空目录</b>再打开 project.godot；不要覆盖叠加到新目录。备份包含整理前源文件，不包含可再生成的 .godot 缓存。</p><p class="muted">若编辑器保留了旧标签，请重新打开项目，避免从旧标签把文件保存回旧位置。配置修改后重开一局进行验证。</p></section><section class="panel"><h3>维护命令</h3><pre class="architecture-tree">python tools/maintenance/audit_paths.py

python tools/maintenance/build_project_guide.py</pre><p class="muted">当前测试日志：.maintenance/checks/current/；路径报告：.maintenance/path_audit.json。HTML 由真实文件和导出字段生成，新增配置后可重新生成。</p></section>`}
function render(){document.querySelectorAll('.nav button').forEach(b=>{b.classList.toggle('active',b.dataset.view===view);b.setAttribute('aria-current',b.dataset.view===view?'page':'false')});$('#page-name').textContent={overview:'项目总览',config:'策划配置台',files:'文件与目录',migration:'路径迁移查询',checks:'整理与验证'}[view];$('#content').innerHTML=({overview,config:configurations,files,migration,checks}[view])()}
function navigate(v){view=v;detail=null;render();window.scrollTo(0,0)}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){navigate(b.dataset.view)}else if(b.dataset.detail){view='config';detail=b.dataset.detail;render();window.scrollTo(0,0)}else if(b.hasAttribute('data-back')){detail=null;render()}else if(b.hasAttribute('data-folder')){folder=b.dataset.folder;render()}else if(b.dataset.copy){let ok=false;try{await navigator.clipboard.writeText(b.dataset.copy);ok=true}catch{const t=document.createElement('textarea');t.value=b.dataset.copy;document.body.append(t);t.select();ok=document.execCommand('copy');t.remove()}$('#toast').textContent=ok?'已复制：'+b.dataset.copy:'请手动复制：'+b.dataset.copy;$('#toast').hidden=false;setTimeout(()=>$('#toast').hidden=true,2500)}});
$('#search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();detail=null;if(view==='overview'||view==='checks')view='config';render()});$('#clear').addEventListener('click',()=>{$('#search').value='';query='';render()});$('#generated').textContent='更新于 '+D.generated;render();
