<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ballsprite 战力计算器 · 单位 / 卡牌 / 遗物 / 药水</title>
<style>
:root{
  --bg:#0d1218; --bg2:#111923; --panel:#16202b; --panel2:#1b2836;
  --line:#2a3a4a; --line2:#3a4f63; --text:#e8eef5; --muted:#93a4b5;
  --gold:#e8b45a; --gold2:#f6d08a; --teal:#54d6c8; --blue:#6aa9ff;
  --red:#f16a6a; --green:#6ed49a; --purple:#b48cff; --orange:#ff9f5a;
  --common:#9aa7b4; --rare:#6aa9ff; --boss:#e8b45a; --legendary:#e8b45a;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:
  radial-gradient(900px 500px at 15% -10%, rgba(84,214,200,.08), transparent 60%),
  radial-gradient(700px 400px at 100% 0%, rgba(232,180,90,.07), transparent 55%),
  var(--bg);
  color:var(--text);font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",system-ui,sans-serif;
  font-size:14px;line-height:1.55;}
body{min-height:100vh}
a{color:var(--teal);text-decoration:none}
button{font-family:inherit}
.topbar{position:sticky;top:0;z-index:20;background:rgba(13,18,24,.88);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);}
.topbar-inner{max-width:1500px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:260px}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(145deg,var(--gold),#8a5a1f);
  display:grid;place-items:center;color:#1a1206;font-weight:900;font-size:18px;box-shadow:0 4px 14px rgba(232,180,90,.25)}
.brand h1{font-size:17px;margin:0;letter-spacing:.4px}
.brand p{margin:2px 0 0;color:var(--muted);font-size:11.5px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.btn{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:9px;
  padding:8px 12px;cursor:pointer;font-size:12.5px;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--line2);background:var(--panel2);transform:translateY(-1px)}
.btn.primary{background:linear-gradient(145deg,#2a6b64,#1c4a46);border-color:#3b8f85;color:#dffaf6}
.btn.gold{background:linear-gradient(145deg,#6b4e22,#433016);border-color:#8a6a2e;color:var(--gold2)}
.btn.danger{color:#ffb3b3;border-color:#5a2d2d}
.btn.small{padding:5px 9px;font-size:11.5px;border-radius:7px}
.btn.icon{padding:6px 9px}
.wrap{max-width:1500px;margin:0 auto;padding:18px 22px 70px}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:16px 0 18px}
.stat{position:relative;background:linear-gradient(160deg,var(--panel),var(--bg2));border:1px solid var(--line);
  border-radius:var(--radius);padding:14px 15px;overflow:hidden;box-shadow:var(--shadow)}
.stat:before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:linear-gradient(90deg,var(--teal),transparent 70%);opacity:.7}
.stat.gold:before{background:linear-gradient(90deg,var(--gold),transparent 70%)}
.stat.blue:before{background:linear-gradient(90deg,var(--blue),transparent 70%)}
.stat.purple:before{background:linear-gradient(90deg,var(--purple),transparent 70%)}
.stat .label{color:var(--muted);font-size:11.5px;letter-spacing:.3px}
.stat .value{font-size:25px;font-weight:800;margin:3px 0 1px;letter-spacing:.3px}
.stat .sub{color:var(--muted);font-size:11px}
.stat .delta{font-size:11px;font-weight:700;margin-left:6px}
.delta.up{color:var(--green)} .delta.down{color:var(--red)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 16px;border-bottom:1px solid var(--line);padding-bottom:10px}
.tab{background:transparent;border:1px solid transparent;color:var(--muted);padding:9px 14px;border-radius:9px;
  cursor:pointer;font-size:13px;transition:.15s;flex:0 0 auto;}
.tab:hover{color:var(--text);background:var(--panel)}
.tab.active{color:#0d1218;background:linear-gradient(145deg,var(--gold2),var(--gold));font-weight:800;
  box-shadow:0 4px 14px rgba(232,180,90,.2)}
.panel{background:linear-gradient(160deg,rgba(22,32,43,.96),rgba(17,25,35,.96));border:1px solid var(--line);
  border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:16px}
.panel h2{font-size:15px;margin:0 0 4px;letter-spacing:.3px}
.panel h3{font-size:13.5px;margin:16px 0 8px;color:var(--gold2)}
.panel .hint{color:var(--muted);font-size:11.5px;margin:0 0 12px}
.grid2{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:1050px){.grid2,.grid3{grid-template-columns:1fr}}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.toolbar input,.toolbar select{background:var(--bg2);border:1px solid var(--line);color:var(--text);
  border-radius:8px;padding:7px 10px;font-size:12.5px;outline:none}
.toolbar input:focus,.toolbar select:focus{border-color:var(--teal)}
.toolbar input{min-width:200px}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:11px;max-height:68vh}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:760px}
th{position:sticky;top:0;background:#1a2633;color:var(--muted);font-weight:700;text-align:left;
  padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:2;font-size:11.5px}
td{padding:8px 10px;border-bottom:1px solid rgba(42,58,74,.6);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer;transition:.12s}
tbody tr:hover{background:rgba(84,214,200,.06)}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.name{font-weight:700;white-space:nowrap}
.sub{color:var(--muted);font-size:11px}
.pill{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;
  padding:2px 8px;font-size:10.5px;color:var(--muted);white-space:nowrap}
.pill.common{color:var(--common);border-color:#3a4654}
.pill.rare{color:var(--rare);border-color:#2f4f7a;background:rgba(106,169,255,.08)}
.pill.boss{color:var(--boss);border-color:#6a5124;background:rgba(232,180,90,.08)}
.pill.good{color:var(--green);border-color:#2f5a40;background:rgba(110,212,154,.07)}
.pill.warn{color:var(--orange);border-color:#6a4a24;background:rgba(255,159,90,.08)}
.pill.bad{color:var(--red);border-color:#6a2d2d;background:rgba(241,106,106,.08)}
.bar{height:7px;border-radius:99px;background:#0b1117;overflow:hidden;min-width:70px}
.bar > i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--teal),var(--blue))}
.bar.gold > i{background:linear-gradient(90deg,var(--gold),var(--orange))}
.bar.red > i{background:linear-gradient(90deg,var(--red),var(--orange))}
.ratio{display:flex;align-items:center;gap:7px;min-width:130px}
.ratio span{font-variant-numeric:tabular-nums;font-size:11px;color:var(--muted);min-width:36px}
.chartbox{min-height:200px}
.donut-wrap{max-width:300px;margin:0 auto}
.svg{width:100%;height:auto;display:block;overflow:visible}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:11.5px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.empty{color:var(--muted);text-align:center;padding:34px 10px;font-size:12.5px}
.warnlist{display:flex;flex-direction:column;gap:8px}
.warn{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line);border-radius:9px;
  padding:9px 11px;background:rgba(255,159,90,.04);font-size:12px}
.warn b{color:var(--orange)}
.warn.ok{background:rgba(110,212,154,.04)}
.warn.ok b{color:var(--green)}
.warn.bad{background:rgba(241,106,106,.05)}
.warn.bad b{color:var(--red)}
.deckrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid rgba(42,58,74,.55)}
.deckrow:last-child{border-bottom:0}
.deckrow .grow{flex:1;min-width:0}
.deckrow .nm{font-weight:700;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deckrow .meta{color:var(--muted);font-size:11px}
.count{display:inline-flex;align-items:center;gap:6px}
.count button{width:24px;height:24px;border-radius:7px;border:1px solid var(--line);background:var(--bg2);
  color:var(--text);cursor:pointer;font-weight:800}
.count input{width:38px;text-align:center;background:var(--bg2);border:1px solid var(--line);color:var(--text);
  border-radius:6px;padding:3px 0;font-size:12px}
.belt{display:flex;gap:8px;flex-wrap:wrap}
.belt .slot{width:96px;height:70px;border:1px dashed var(--line2);border-radius:10px;display:grid;place-items:center;
  color:var(--muted);font-size:11px;text-align:center;padding:6px;cursor:pointer}
.belt .slot.filled{border-style:solid;background:var(--panel2);color:var(--text);cursor:default}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(520px,96vw);background:#101821;border-left:1px solid var(--line2);
  box-shadow:-20px 0 60px rgba(0,0,0,.45);transform:translateX(105%);transition:.2s;z-index:50;
  display:flex;flex-direction:column}
.drawer.open{transform:translateX(0)}
.drawer-head{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.drawer-head .grow{flex:1;min-width:0}
.drawer-head h2{margin:0;font-size:16px}
.drawer-head p{margin:2px 0 0;color:var(--muted);font-size:11.5px}
.drawer-body{padding:16px 18px;overflow:auto;flex:1}
.field{display:grid;grid-template-columns:100px 1fr;gap:8px;align-items:center;margin:7px 0}
.field label{color:var(--muted);font-size:12px}
.field input,.field select{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--text);
  border-radius:7px;padding:6px 8px;font-size:12.5px}
.field input:focus{border-color:var(--teal)}
.skillrow{display:grid;grid-template-columns:1.2fr .6fr .6fr .6fr;gap:6px;padding:5px 0;border-bottom:1px solid rgba(42,58,74,.5);font-size:11.5px}
.formula{background:#0b1117;border:1px solid var(--line);border-radius:9px;padding:11px;font-family:Consolas,monospace;
  font-size:11.5px;color:#b9c9d8;white-space:pre-wrap;word-break:break-word}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid rgba(42,58,74,.5);font-size:12px}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{font-variant-numeric:tabular-nums;font-weight:700}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;
  background:#1d2a38;border:1px solid var(--line2);color:var(--text);padding:9px 16px;border-radius:9px;
  font-size:12px;z-index:80;transition:.2s;pointer-events:none;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.footer{color:var(--muted);font-size:11px;text-align:center;padding:20px 0 0}
.mono{font-family:Consolas,monospace;font-variant-numeric:tabular-nums}
.tip{color:var(--muted);font-size:11px}
.hr{height:1px;background:var(--line);margin:14px 0}
.toggle{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;cursor:pointer;user-select:none}
.toggle input{accent-color:var(--teal)}
@media(max-width:760px){
  .topbar-inner{padding:12px 14px;gap:10px}
  .brand{min-width:0;flex:1 1 100%}
  .brand h1{font-size:15px}
  .actions{width:100%;margin-left:0;gap:6px}
  .actions .btn{padding:6px 9px;font-size:11px}
  .wrap{padding:12px 14px 60px}
  .summary{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .stat{padding:11px 12px}
  .stat .value{font-size:21px}
  .panel{padding:12px}
  .tab{padding:7px 10px;font-size:12px}
  .drawer{width:100vw}
  .donut-wrap{max-width:240px}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo">P</div>
      <div>
        <h1>ballsprite 战力计算器</h1>
        <p>单位 · 卡牌 · 遗物 · 药水｜设计估价，不是实战胜率</p>
      </div>
    </div>
    <div class="actions">
      <button class="btn" id="btnPreset">起始牌组</button>
      <button class="btn" id="btnCompareA">存为 A</button>
      <button class="btn" id="btnCompareB">存为 B</button>
      <button class="btn" id="btnExport">导出</button>
      <button class="btn" id="btnImport">导入</button>
      <button class="btn danger" id="btnReset">清空</button>
      <input type="file" id="fileImport" accept="application/json" style="display:none">
    </div>
  </div>
</header>
<div class="wrap">
  <div class="summary" id="summary"></div>
  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="overview">总览</button>
    <button class="tab" data-tab="units">单位战力</button>
    <button class="tab" data-tab="cards">卡牌战力</button>
    <button class="tab" data-tab="relics">遗物战力</button>
    <button class="tab" data-tab="potions">药水战力</button>
    <button class="tab" data-tab="build">构筑模拟</button>
    <button class="tab" data-tab="calibration">校准</button>
  </nav>
  <main id="view"></main>
  <div class="footer" id="footer"></div>
</div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <div class="grow"><h2 id="drawerTitle">详情</h2><p id="drawerSub"></p></div>
    <button class="btn small" id="drawerClose">关闭</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>
<div class="toast" id="toast"></div>
<script>
const DATA = /*__DATA__*/;
/*__APP__*/
</script>
</body>
</html>
