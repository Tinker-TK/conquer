<style>
:root{--nav:#152d2c;--bg:#f3f5ef;--ink:#18332e;--muted:#65736a;--line:#dce4d9;--green:#276b51;--lime:#dcec87;--white:#fff;--amber:#a26427}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 "Segoe UI","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}a{color:var(--green);text-decoration:none}a:hover{text-decoration:underline}button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #85b349;outline-offset:3px}.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}.sidebar{background:var(--nav);color:#e7eee5;padding:32px 24px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}.brand{font-size:25px;font-weight:750;letter-spacing:-.8px}.brand span{display:inline-block;width:14px;height:14px;background:var(--lime);border-radius:50%;margin-right:10px}.eyebrow{font-size:11px;letter-spacing:2px;font-weight:700;text-transform:uppercase}.sidebar .eyebrow{color:#9eb6a8;margin-top:7px}.nav{display:grid;gap:9px;margin-top:44px}.nav button{border:0;background:transparent;text-align:left;border-radius:9px;color:#c2d3c7;padding:12px 15px;font-weight:600}.nav button.active{background:var(--lime);color:var(--nav)}.nav button:hover:not(.active){background:#24413b}.nav small{display:inline-block;width:27px;opacity:.6}.side-note{margin-top:auto;border-top:1px solid #39534a;padding-top:24px;font-size:12px;color:#a4baac}.side-note strong{color:#e6eedf;display:block;margin-bottom:8px}main{min-width:0;padding:30px 42px 65px;max-width:1500px}.topbar{display:flex;gap:22px;align-items:center;justify-content:space-between;margin-bottom:34px}.breadcrumb{font-size:12px;letter-spacing:1px;color:var(--muted)}.search{width:min(430px,60%);display:flex;align-items:center;gap:10px;background:white;border:1px solid var(--line);padding:9px 14px;border-radius:9px}.search input{min-width:0;width:100%;border:0;outline:0;background:transparent;font-size:13px}.search button{border:0;background:none;color:var(--muted)}h1{font-size:38px;line-height:1.25;letter-spacing:-1px;margin:12px 0 17px}h2{font-size:24px;margin:0 0 6px}h3{font-size:17px;margin:0 0 8px}p{margin:0 0 14px}.muted{color:var(--muted)}.hero{display:grid;grid-template-columns:1.35fr 1fr;gap:28px;align-items:center;margin-bottom:27px}.hero p{max-width:650px;color:var(--muted)}.hero-label{color:var(--green)}.hero-box{background:var(--nav);color:white;border-radius:14px;padding:25px;position:relative;overflow:hidden}.hero-box .eyebrow{color:#aecaa9}.hero-box .line{display:flex;gap:12px;align-items:center;margin-top:12px;font-size:13px}.dot{background:var(--lime);width:7px;height:7px;border-radius:100%;flex:none}.hero-box strong{font-size:20px;display:block;margin:10px 0 18px}.btn{border:0;background:var(--green);color:white;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:650}.btn.light{background:var(--lime);color:var(--nav)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:25px 0 32px}.metric{background:white;border:1px solid var(--line);border-radius:10px;padding:17px 20px}.metric b{display:block;font-size:27px;line-height:1.3}.metric span{color:var(--muted);font-size:12px}.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:30px 0 17px}.section-head p{margin:0;font-size:13px}.flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.flow-card{padding:20px 16px;background:#e5ebe0;border-radius:10px;border-top:3px solid var(--green);position:relative}.flow-card:not(:last-child):after{content:'→';position:absolute;right:-15px;top:35%;z-index:1;color:var(--green)}.flow-card strong{display:block;font-size:15px}.flow-card small{font-size:11px;color:var(--muted);word-break:break-all}.flow-card .step{font-size:10px;color:var(--green);display:block;margin-bottom:8px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:22px;text-align:left;display:flex;flex-direction:column;color:var(--ink);min-width:0}.card:hover{border-color:#83a38b;box-shadow:0 5px 18px #18332e09}.card .tag{font-size:11px;color:var(--green);letter-spacing:.5px;margin-bottom:13px}.card p{font-size:13px;color:var(--muted);flex:1;margin-bottom:17px}.card footer{font-size:12px;color:var(--green);border-top:1px solid var(--line);padding-top:12px;display:flex;justify-content:space-between}.badge{display:inline-block;background:#e8f0dd;color:#336042;padding:3px 9px;border-radius:5px;font-size:11px;font-weight:600}.badge.amber{background:#fcf0de;color:var(--amber)}.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:24px;margin-top:20px}.panel p:last-child{margin:0}.notice{border-left:3px solid #b0bc68;background:#edf0dc;padding:16px 20px;margin:20px 0;font-size:13px}.page-intro{margin-bottom:25px}.page-intro p{max-width:840px;color:var(--muted)}.back{border:0;background:none;color:var(--green);padding:0;margin:0 0 20px}.paths{display:grid;gap:9px;margin:17px 0}.path{display:flex;gap:10px;align-items:center;background:#f4f6f0;border:1px solid #e1e7dc;padding:9px 12px;border-radius:7px;min-width:0}.path a{flex:1;min-width:0;overflow-wrap:anywhere;font:12px/1.6 Consolas,monospace}.copy{border:1px solid #cdd9c9;border-radius:5px;background:white;font-size:11px;padding:3px 9px;color:var(--green);flex:none}.detail-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:20px}.detail-grid .panel{margin-top:0}ol,ul{padding-left:22px;margin:12px 0}li{margin:9px 0}table{border-collapse:collapse;width:100%;font-size:13px}th{text-align:left;background:#eef2e8;color:#45604d;font-size:12px;font-weight:650}td,th{border-bottom:1px solid var(--line);padding:11px 13px;vertical-align:top}td code{font:12px/1.6 Consolas,monospace;overflow-wrap:anywhere}code{color:#315e48}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:9px}.table-wrap table{min-width:580px}td .muted{font-size:11px}.field-label{font-weight:650}.check-row{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}.check-row span:last-child{margin-left:auto}.folder-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.folder-btn{border:1px solid var(--line);background:white;border-radius:8px;padding:13px;text-align:left;color:var(--ink)}.folder-btn.selected{border-color:var(--green);background:#e5eedf}.folder-btn b{display:block}.folder-btn small{color:var(--muted);font-size:11px}.file-toolbar{display:flex;gap:12px;justify-content:space-between;align-items:center;margin:18px 0}.file-list{background:white;border:1px solid var(--line);border-radius:10px;max-height:650px;overflow:auto;padding:8px 15px}.file-list .path{border:none;border-bottom:1px solid var(--line);border-radius:0;background:transparent;margin:0}.file-list .ext{font-size:10px;color:var(--muted);width:40px;flex:none}.empty{padding:45px;text-align:center;color:var(--muted)}.architecture-tree{font:12px/1.85 Consolas,"Microsoft YaHei",monospace;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--nav);color:#cfdfd0;padding:24px;border-radius:10px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--nav);color:white;padding:10px 20px;border-radius:9px;box-shadow:0 4px 20px #0002;z-index:20;font-size:13px}.split{display:grid;grid-template-columns:1fr 1fr;gap:20px}.fine{font-size:12px;color:var(--muted);margin-top:25px}.migration-count{margin:16px 0;color:var(--muted);font-size:13px}[hidden]{display:none!important}
@media(min-width:1600px){main{padding-left:60px;padding-right:60px}}@media(max-width:1150px){.shell{grid-template-columns:205px minmax(0,1fr)}main{padding:26px}.sidebar{padding:27px 18px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{grid-template-columns:1fr}.hero-box{display:none}.detail-grid,.split{grid-template-columns:1fr}.folder-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.shell{display:block}.sidebar{position:relative;height:auto;padding:20px}.brand{font-size:23px}.sidebar .eyebrow,.side-note{display:none}.nav{display:flex;overflow-x:auto;gap:5px;margin-top:18px}.nav button{white-space:nowrap;padding:9px 10px;font-size:12px}.nav small{display:none}main{padding:22px 18px}.topbar{display:block;margin-bottom:23px}.breadcrumb{margin-bottom:12px}.search{width:100%}h1{font-size:30px}.metrics{grid-template-columns:repeat(2,1fr);gap:9px}.metric{padding:15px}.grid{grid-template-columns:1fr}.flow{grid-template-columns:1fr;gap:8px}.flow-card{padding:12px 16px;display:flex;align-items:center;gap:13px}.flow-card small{margin-left:auto}.flow-card .step{margin:0}.flow-card:not(:last-child):after{content:none}.folder-grid{grid-template-columns:repeat(2,1fr)}.panel{padding:18px}.path{align-items:flex-start}.copy{font-size:10px}.section-head{align-items:flex-start}.section-head h2{font-size:21px}.file-toolbar{align-items:flex-start;flex-direction:column}.file-list{padding:5px}.file-list .ext{display:none}}
@media print{.sidebar,.topbar,.back,.copy,.btn{display:none}.shell{display:block}main{max-width:none;padding:0}.panel,.card{break-inside:avoid}.file-list{max-height:none}}
</style></head>
<body><div class="shell"><aside class="sidebar"><div class="brand"><span></span>ballsprite</div><div class="eyebrow">PROJECT FIELD GUIDE</div><nav class="nav" aria-label="项目导航"><button data-view="overview" class="active"><small>01</small>项目总览</button><button data-view="config"><small>02</small>策划配置台</button><button data-view="files"><small>03</small>文件与目录</button><button data-view="migration"><small>04</small>路径迁移查询</button><button data-view="checks"><small>05</small>整理与验证</button></nav><div class="side-note"><strong>配置 → 场景 → 运行逻辑</strong>先找想改的玩法，再找对应文件。<br>本页可离线使用，无需联网。<div id="generated" style="margin-top:18px"></div></div></aside><main><header class="topbar"><div class="breadcrumb">开发手册 / <span id="page-name">项目总览</span></div><label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜索配置、字段或路径…" aria-label="搜索配置、字段或路径"><button id="clear" aria-label="清空搜索">×</button></label></header><div id="content"></div><footer class="fine">路径以项目根目录为起点。点击文件可查看内容；复制 res:// 路径后在 Godot 文件系统中定位。<br>这是一份导航文档，修改网页不会修改游戏数据。</footer></main></div><div id="toast" class="toast" role="status" hidden></div>
<script id="project-data" type="application/json">__PROJECT_DATA__</script>
<script>
const D=JSON.parse(document.getElementById('project-data').textContent);let view='overview',query='',folder='',detail=null;
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const link=p=>'../'+p.split('/').map(encodeURIComponent).join('/');
const pathRow=p=>`<div class="path"><a href="${link(p)}" target="_blank" rel="noopener">res://${esc(p)}</a><button class="copy" data-copy="res://${esc(p)}">复制路径</button></div>`;
const heading=(label,title,desc)=>`<div class="page-intro"><div class="eyebrow hero-label">${label}</div><h1>${title}</h1><p>${desc}</p></div>`;
const card=e=>`<button class="card" data-detail="${e.id}"><span class="tag">${esc(e.mode)}</span><h3>${esc(e.title)}</h3><p>${esc(e.summary)}</p><footer><span>${e.fields.length?e.fields.length+' 个参数入口':'场景与目录入口'}</span><span>查看配置 →</span></footer></button>`;
const stat=(v,t)=>`<div class="metric"><b>${v}</b><span>${t}</span></div>`;
const folders={data:'数值与资源结构',scenes:'可视化场景',scripts:'玩法运行逻辑',autoload:'全局状态与信号',assets:'美术与源素材',shaders:'着色器',themes:'UI 主题',examples:'示例与模板用法',tests:'回归与资源检查',addons:'编辑器插件',docs:'项目与配置文档',tools:'维护工具'};
function overview(){return `<section class="hero"><div><div class="eyebrow hero-label">GODOT 4.6 · 策划工作地图</div><h1>想改什么，<br>就从这里找到入口。</h1><p>把配置、场景和程序职责串起来。无需先读完整项目，直接定位单位、技能、卡牌、关卡与地图的修改位置。</p><button class="btn" data-view="config">进入策划配置台 ↗</button></div><div class="hero-box"><div class="eyebrow">CURRENT GAME LOOP</div><strong>地图选择 · 卡牌部署 · 自动战斗</strong><div class="line"><i class="dot"></i>整局数据跨战斗保留</div><div class="line"><i class="dot"></i>战斗按出牌 / 部署 / 自动战斗推进</div><div class="line"><i class="dot"></i>基地归零失败，有限波次清场获胜</div></div></section><div class="metrics">${stat(D.entries.length,'个策划配置主题')}${stat(Object.keys(D.migration.moved).length,'个文件完成路径迁移')}${stat(D.checks.filter(c=>c.passed).length,'项流程回归通过')}${stat(D.resource_checks,'个 Godot 资源加载通过')}</div><div class="section-head"><div><h2>运行关系，一眼看懂</h2><p class="muted">资源提供规则，场景负责摆放，脚本执行行为。</p></div></div><div class="flow">${[['主菜单','scenes/ui/'],['整局外壳','scenes/app/'],['地图 / 关卡','data/levels/'],['出牌与部署','scripts/cards/'],['自动战斗','scripts/units/']].map((x,i)=>`<div class="flow-card"><span class="step">0${i+1}</span><strong>${x[0]}</strong><small>${x[1]}</small></div>`).join('')}</div><div class="notice"><b>最常用入口：</b>初始牌组在 data/run，兵种在 data/units，技能在 data/skills，波次在 scenes/levels/waves。新增配置后，要把它绑定到单位或关卡，才会进入游戏。</div><div class="section-head"><h2>从一个具体需求开始</h2><button class="back" data-view="config" style="margin:0">全部配置 →</button></div><div class="grid">${['units','summon','levels','cards','run','potions'].map(id=>card(D.entries.find(e=>e.id===id))).join('')}</div>`}
function configurations(){if(detail)return details(D.entries.find(e=>e.id===detail));let list=D.entries.filter(e=>JSON.stringify(e).toLowerCase().includes(query));return heading('DESIGNER WORKBENCH','策划配置台','每张卡片都列出实际文件路径、操作顺序和参数说明。标注“检查器 + 脚本”的功能尚未全部数据化。')+`<p class="muted">找到 ${list.length} / ${D.entries.length} 个主题</p><div class="grid">${list.map(card).join('')}</div>${list.length?'':'<div class="empty">没有匹配配置。可切换到“文件与目录”或“路径迁移查询”查找文件。</div>'}`}
function details(e){return `<button class="back" data-back>← 返回全部配置</button>`+heading(e.mode,e.title,e.summary)+`<div class="detail-grid"><section class="panel"><h3>在这里修改</h3><div class="paths">${e.paths.map(pathRow).join('')}</div></section><section class="panel"><h3>配置步骤</h3><ol>${e.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></section></div><div class="notice"><b>配置时留意</b><ul>${e.notes.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div>${e.fields.length?`<div class="section-head"><h2>参数速查</h2><p class="muted">来自当前脚本的导出字段；各 .tres 可覆盖默认值。</p></div><div class="table-wrap"><table><thead><tr><th>用途</th><th>Inspector 字段</th><th>类型 / 默认声明</th></tr></thead><tbody>${e.fields.map(f=>`<tr><td class="field-label">${esc(f.label)}</td><td><code>${esc(f.name)}</code><div class="muted"><a href="${link(f.source)}" target="_blank">${esc(f.source)}</a></div></td><td><code>${esc(f.declaration)}</code></td></tr>`).join('')}</tbody></table></div>`:''}${e.id==='units'?`<div class="section-head"><h2>单位场景 → 实际属性资源</h2></div><div class="table-wrap"><table><thead><tr><th>场景</th><th>属性入口</th></tr></thead><tbody>${D.units.map(u=>`<tr><td><a href="${link(u.scene)}">${esc(u.scene)}</a></td><td>${u.data.startsWith('data/')?`<a href="${link(u.data)}">${esc(u.data)}</a>`:esc(u.data)}</td></tr>`).join('')}</tbody></table></div>`:''}`}
function files(){let rows=D.files.filter(f=>(!folder||f.path.startsWith(folder+'/'))&&f.path.toLowerCase().includes(query));return heading('PROJECT DIRECTORY','文件与目录','选择职责分类，再搜索文件名。源素材予以保留；自动生成的 .uid、.import 和缓存不在此列表中展示。')+`<div class="folder-grid">${Object.entries(folders).map(([p,label])=>`<button class="folder-btn ${folder===p?'selected':''}" data-folder="${p}"><b>${p}/</b><small>${label}</small></button>`).join('')}</div><div class="file-toolbar"><span class="muted">${folder?folder+'/':'全部目录'} · ${rows.length} 个文件</span><button class="copy" data-folder="">显示全部</button></div><div class="file-list">${rows.map(f=>`<div class="path"><span class="ext">${esc(f.path.split('.').pop())}</span><a href="${link(f.path)}" target="_blank">${esc(f.path)}</a><button class="copy" data-copy="res://${esc(f.path)}">复制</button></div>`).join('')||'<div class="empty">没有匹配文件</div>'}</div><details class="panel"><summary>查看核心目录树</summary><pre class="architecture-tree">project.godot                  ← Godot 入口与自动加载配置
├─ autoload/                   全局状态 / 信号 / 本局进度
├─ data/
│  ├─ run/                     开局数值、牌组
│  ├─ units/                   单位属性
│  ├─ skills/                  技能配方
│  ├─ cards/ · card_effects/    卡牌与单条效果
│  ├─ levels/                  关卡规则
│  └─ relics/ · potions/        遗物与药水
├─ scenes/
│  ├─ app/ · battle/           整局外壳 / 战斗基础场景
│  ├─ levels/                  battles / waves / templates
│  ├─ units/ · components/     单位 / 共用组件
│  ├─ cards/ · ui/ · map/      卡面 / UI / 地图节点
│  └─ effects/ · projectiles/ · world/
├─ scripts/                    按 app、battle、cards、combat、
│                              items、map、skills、ui、units、world 分类
├─ assets/ · shaders/ · themes/ 美术与外观资源
├─ examples/                   示例配置、场景、演示脚本
├─ tests/ · tools/maintenance/ 验证与维护
├─ addons/                     编辑器插件
└─ docs/                       当前导航与配置说明</pre></details>`}
function migration(){let pairs=Object.entries(D.migration.moved).filter(([a,b])=>!a.endsWith('.uid')&&(a+' '+b).toLowerCase().includes(query));return heading('PATH MIGRATION','旧路径，找到新位置。','可搜索旧文件名或新目录。场景 UID 与脚本 .uid 已保留，运行引用、动态加载路径和插件默认输出目录已同步。')+`<div class="migration-count">${pairs.length} 条路径（隐藏伴随 .uid 文件） · <a href="reorganization_manifest.json" target="_blank">完整迁移清单 JSON ↗</a></div><div class="table-wrap"><table><thead><tr><th>整理前</th><th>现在的位置</th></tr></thead><tbody>${pairs.map(([a,b])=>`<tr><td><code>${esc(a)}</code></td><td>${pathRow(b)}</td></tr>`).join('')}</tbody></table></div>${pairs.length?'':'<div class="empty">没有匹配的迁移记录。</div>'}`}
function checks(){return heading('MAINTENANCE REPORT','整理与验证','整理以保留现有玩法与数值为前提。以下结果来自当前真实项目检查；本轮清理范围和备份位置见项目清理记录。')+`<div class="split"><section class="panel"><h3>早期目录整理（历史记录）</h3><ul><li>迁移 ${Object.keys(D.migration.moved).length} 个文件（含脚本 UID）。</li><li>清理空脚本、无操作回调、过时的注释代码、临时场景与旧 QA 工程。</li><li>分离示例与测试；数据结构脚本与配置同目录，兼容数据表插件。</li><li>入口、显式引用、动态单位加载与编辑器历史路径同步更新。</li></ul><h3 style="margin-top:22px">有意保留</h3><p class="muted">可复用的单位与卡面场景、美术原稿、素材授权、模板、两个编辑器插件及正常 .godot 缓存。未在主场景中引用，不代表没有设计用途。</p></section><section class="panel"><h3>整理前发现的旧测试问题</h3><ul><li>初始牌组已扩充，旧测试仍写死 14 张。</li><li>波次已改成 5 个兽人，旧测试仍写死双兽人位置。</li><li>旧直接写速度的部署测试与当前导航系统不一致。</li></ul><p class="muted">前两项改为读取当前配置；部署保留真实寻路、避让与停止回归，退役旧测试。游戏内容没有为了测试而改回旧值。</p></section></div><section class="panel"><h3>流程回归 · ${D.checks.filter(c=>c.passed).length} / ${D.checks.length}</h3>${D.checks.map(c=>`<div class="check-row"><span>${esc(c.name)}</span><span class="badge ${c.passed?'':'amber'}">${c.passed?'通过':'需检查'}</span></div>`).join('')}</section><section class="panel"><h3>资源与路径</h3><p>Godot 加载检查：${D.resource_checks} 个资源通过。显式引用检查：${D.audit.explicit_references||0} 条；单位动态场景检查：${D.audit.unit_scene_checks||0} 项。断链 ${D.audit.missing?.length||0} 项，孤立导入元数据 ${D.audit.orphan_sidecars?.length||0} 项。</p><p class="muted">Windows 环境报告系统证书存储读取警告，与本地游戏资源检查无关。自动测试覆盖逻辑与路径，不代替所有视觉和交互场景的人工试玩。</p></section><section class="panel"><h3>备份与恢复</h3><p>历次备份与本轮源文件备份已移到项目外，路径和恢复方法见 <a href="项目清理记录.md">项目清理记录</a>。</p><p>需要恢复时，将 ZIP 解压到<b>另一个空目录</b>再打开 project.godot；不要覆盖叠加到新目录。备份包含整理前源文件，不包含可再生成的 .godot 缓存。</p><p class="muted">若编辑器保留了旧标签，请重新打开项目，避免从旧标签把文件保存回旧位置。配置修改后重开一局进行验证。</p></section><section class="panel"><h3>维护命令</h3><pre class="architecture-tree">python tools/maintenance/audit_paths.py

python tools/maintenance/build_project_guide.py</pre><p class="muted">当前测试日志：.maintenance/checks/current/；路径报告：.maintenance/path_audit.json。HTML 由真实文件和导出字段生成，新增配置后可重新生成。</p></section>`}
function render(){document.querySelectorAll('.nav button').forEach(b=>{b.classList.toggle('active',b.dataset.view===view);b.setAttribute('aria-current',b.dataset.view===view?'page':'false')});$('#page-name').textContent={overview:'项目总览',config:'策划配置台',files:'文件与目录',migration:'路径迁移查询',checks:'整理与验证'}[view];$('#content').innerHTML=({overview,config:configurations,files,migration,checks}[view])()}
function navigate(v){view=v;detail=null;render();window.scrollTo(0,0)}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){navigate(b.dataset.view)}else if(b.dataset.detail){view='config';detail=b.dataset.detail;render();window.scrollTo(0,0)}else if(b.hasAttribute('data-back')){detail=null;render()}else if(b.hasAttribute('data-folder')){folder=b.dataset.folder;render()}else if(b.dataset.copy){let ok=false;try{await navigator.clipboard.writeText(b.dataset.copy);ok=true}catch{const t=document.createElement('textarea');t.value=b.dataset.copy;document.body.append(t);t.select();ok=document.execCommand('copy');t.remove()}$('#toast').textContent=ok?'已复制：'+b.dataset.copy:'请手动复制：'+b.dataset.copy;$('#toast').hidden=false;setTimeout(()=>$('#toast').hidden=true,2500)}});
$('#search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();detail=null;if(view==='overview'||view==='checks')view='config';render()});$('#clear').addEventListener('click',()=>{$('#search').value='';query='';render()});$('#generated').textContent='更新于 '+D.generated;render();
