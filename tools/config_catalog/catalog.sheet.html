<style>

.namecol{position:sticky;left:0;z-index:1;min-width:235px;max-width:235px}.namecol.header{z-index:3;background:#dbe7e7}.namebox{padding:7px 10px}.namebox strong{font-size:12px;display:block}.namebox small{font:10px Consolas,monospace;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cell{min-width:125px;width:100%;border:0!important;border-radius:0!important;background:transparent!important;padding:11px 9px!important;outline:0;color:var(--ink)}.cell:focus{box-shadow:inset 0 0 0 2px var(--green);background:#fff!important}.wide{min-width:260px}.changed{background:#fff4d8!important}.readcell{padding:9px 10px;color:#5d7080;max-height:73px;overflow:auto}.readcell button{padding:3px 6px;font-size:11px}.pathcell{font:11px Consolas,monospace;overflow-wrap:anywhere}.row-action{min-width:78px;text-align:center;padding:5px}.row-action button{font-size:11px;padding:5px 8px}.newcol{background:#fff0c7!important}.newcol button{float:right;padding:0 4px;background:transparent;border:0;font-size:14px;color:#8d5d18}.sheet-foot{font-size:11px;color:var(--muted);padding:12px 2px}

@media(max-width:750px){header{display:block}.actions{margin-top:12px}.layout{display:block}nav{display:flex;overflow:auto;padding:8px}nav button{white-space:nowrap;width:auto}.nav-note,.small-head{display:none}main{padding:16px}.sheet-head{display:block}.toolrow{margin-top:10px}.toolrow input{width:100%}.status{padding:8px 16px}}

<body>
<header><div><h1>游戏配置表</h1><p>BALLSPRITE · 策划配置合集 · 每行一项配置</p></div><div class="actions">
<button id="help">使用说明</button><button id="import">导入合集</button><button id="save">保存 HTML</button><button id="export">导出 JSON</button><button id="diff">查看修改 <b id="change-count">0</b></button><button class="primary" id="apply">一键应用到游戏</button>
</div></header>
<div class="status"><span id="mode">离线编辑 · 保存 HTML 后可交给 Codex 应用</span><span id="stamp"></span></div>
<div class="layout">
<nav><div class="small-head">CONFIG TABLES</div><div id="tabs"></div><div class="nav-note">横向滚动查看全部列。<br><br>共用技能只有一行，修改后影响引用它的所有单位。</div></nav>
<main><div class="sheet-head"><div><h2 id="sheet-title"></h2><p id="sheet-subtitle"></p></div><div class="toolrow"><input id="search" placeholder="搜索名称、效果或路径" aria-label="搜索配置"><button id="add-row">＋ 新增配置行</button><button id="add-column">＋ 新增字段列</button></div></div>
<div class="tablebox"><table id="sheet"><thead id="sheet-head"></thead><tbody id="sheet-body"></tbody></table></div><div class="sheet-foot" id="sheet-foot"></div></main>
</div>
<dialog id="modal"><div id="modal-body"></div><div class="dialog-actions"><button id="close-modal">关闭</button></div></dialog>
<div id="toast" role="status"></div><input id="file-input" type="file" accept=".json,.html" hidden>
<script id="catalog-data" type="application/json">__CATALOG_DATA__</script>
<script>
'use strict';
let data=JSON.parse(document.getElementById('catalog-data').textContent);
let category='cards',token=null,index=new Map(),visible=[],columns=[];
const $=id=>document.getElementById(id),copy=x=>JSON.parse(JSON.stringify(x)),same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
const titles={cards:'卡牌效果',card_effects:'卡牌效果明细',allies:'己方单位特性',enemies:'敌方单位特性',skills:'技能配置',relics:'遗物效果',potions:'药水效果'};
const family=cat=>cat==='allies'||cat==='enemies'?'units':cat;
const fieldNames={retain_in_hand:'固有（回合末保留）',starts_in_hand:'开局优先入手',"monster_rank":"怪物等级","crowded_unit_count":"狂化拥挤阈值","crowded_stat_percent":"拥挤攻防百分比","solo_attack_bonus_percent":"独存攻击增幅","solo_defence_bonus_percent":"独存防御增幅","cooldown_reduction_percent":"独存冷却减少","required_unit_types":"所需兵种种类","minimum_attack_percent":"近身攻击百分比","distance_for_max_bonus":"满增益距离",rarity:"卡牌品质",upgrade_ability_points:'升级能力点数',max_upgrade_count:'可强化次数',upgrade_amount:'每次强化效果增量',unit_name:'单位名称',unit_english_name:'英文标识',unit_type:'兵种类型',unit_team:'阵营',max_hp:'最大生命',defence:'防御',attack:'攻击',speed:'速度',dodge_rate:'闪避率',card_cost:'卡牌费用',card_name:'卡牌名称',card_discription:'卡牌说明',skill_name:'技能名称',description:'说明文案',attack_rate:'伤害倍率',cooldown:'冷却秒数',priority:'优先级',cast_range:'施法距离',manual_finish:'手动结束',cast_animation:'施法动画',hit_frame:'命中帧',target_type:'索敌方式',on_hit_effect:'命中特效',projectile_trajectory:'弹道',pierce_count:'穿透数',projectile_scene:'投射物',projectile_pos:'发射偏移',summon_scene:'召唤单位',summon_offset:'召唤偏移',effect_animation:'特效动画',category:'卡牌类型',target:'目标类型',after_use:'使用后',effects:'效果',lifetime:'期限',lasting_rounds:'回合数',kind:'效果类型',amount:'效果数值',radius:'半径',interval:'间隔',affected_team:'作用阵营',id:'标识',display_name:'名称',draw_threshold:'抽牌门槛',rounds:'持续回合',targets:'作用阵营',damage:'伤害',duration:'持续秒数',casts:'次数',cast_delay:'释放间隔',skills:'技能'};
const enumNames={HAND_CARD:'其它手牌',NORMAL:"普通",ELITE:"精英",BOSS:"首领",LEGENDARY:"传说",PERSIST:"常驻至战斗结束",COMMON:"普通（蓝框）",RARE:"稀有（金框）",RECRUIT:'征召',ENHANCEMENT:'强化',ABILITY:'能力',NONE:'无目标',ALLY:'友军',ENEMY:'敌军',ANY_UNIT:'任意单位',POSITION:'战场位置',DISCARD:'弃牌堆',EXHAUST:'消耗区',BATTLE:'本场',ROUNDS:'指定回合',RUN:'本局',ENEMIES:'敌军',ALLIES:'友军',BOTH:'双方',DRAW_ENERGY:'抽牌获能量',BASE_HEALTH:'基地生命',BASE_DEFENCE:'基地防御',OPENING_DEFENCE:'开战防御',TORNADO:'龙卷风',LIGHTNING:'闪电',FIRE:'火焰',THUNDER_CLOUD:'雷云',ENEMY_NEAREST:'最近敌人',ALLY_LOWEST_HP:'低血友军',SELF:'自身',ENEMY_LOWEST_HP:'最低生命敌人',ENEMY_LOWEST_HP_PERCENT:'最低生命比例敌人'};
const kindNames={30:'战友（下一单位减费）',31:'进化（临时升级手牌）',19:"留存友军",20:"虚弱",21:"易伤",22:"防御降低",23:"麻痹",24:"策反",25:"狂化",26:"下回合按幸存者抽牌",27:"合理搭配",28:"保持距离",29:"审判者",0:'攻击提升',1:'百分比治疗',2:'防御提升',3:'攻击附毒',4:'死亡爆炸',6:'复制友军',7:'伤害区域',8:'减速区域',9:'抽牌',10:'停止抽牌',11:'支付生命',12:'每轮获得能量',13:'阵亡攻击光环',14:'随机出牌',15:'撤回友军',16:'自定义',17:'立即获得能量',18:'最大生命提升'};
const sheetKeys={cards:['card_name','card_cost','rarity','category','target','after_use','retain_in_hand','starts_in_hand','max_upgrade_count','__summary','card_discription'],card_effects:['kind','amount','upgrade_amount','lifetime','lasting_rounds','radius','interval','affected_team'],allies:['unit_name','card_cost','upgrade_ability_points','max_upgrade_count','max_hp','attack','defence','speed','dodge_rate','skills','dodge_skill'],enemies:['unit_name','monster_rank','max_hp','attack','defence','speed','dodge_rate','skills','dodge_skill'],skills:['skill_name','attack_rate','cooldown','priority','cast_range','cast_animation','hit_frame','target_type','on_hit_effect'],relics:['display_name','kind','amount','draw_threshold','rounds','description'],potions:['display_name','kind','targets','damage','radius','interval','speed','duration','casts','cast_delay','description']};
fieldNames.unlock_upgrade_levels='解锁强化等级';
sheetKeys.skills=['unit_name','skill_name','unlock_upgrade_levels',...sheetKeys.skills.filter(key=>key!=='skill_name')];
const label=f=>f.label||fieldNames[f.name]||f.name,find=(r,k)=>r.group==='skills'&&k==='unit_name'?skillUnitsField(r):r.fields.find(f=>f.name===k),value=(r,k)=>find(r,k)?.value,dirty=f=>!same(f.value,f.base);
function skillUnitsField(r){const names=[...new Set(data.records.filter(unit=>unit.group==='units'&&((value(unit,'skills')||[]).includes(r.id)||value(unit,'dodge_skill')===r.id)).map(unit=>value(unit,'unit_name')||unit.id))].sort();const text=names.join('、')||'未关联单位';return{name:'unit_name',type:4,editable:false,value:text,base:text,description:'根据单位的技能列表和防守反击配置自动显示关联单位；共享技能列出全部单位名称。'}}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function enumOptions(f){let n=-1;return(f.hint_string||'').split(',').filter(Boolean).map(s=>{let a=s.split(':');n=a.length>1?Number(a[a.length-1]):n+1;const key=a[0].toUpperCase().replaceAll(' ','_');return[n,enumNames[key]||a[0]]})}
function enumValue(f){if(f.name==='kind'&&kindNames[f.value]!==undefined&&index.get(f._record)?.script.endsWith('/card_effect.gd'))return kindNames[f.value];return enumOptions(f).find(o=>o[0]===f.value)?.[1]??String(f.value)}
function title(r){if(r.script.endsWith('/card_effect.gd')){let owner=index.get(r.used_by?.find(id=>index.has(id)));return(owner?value(owner,'card_name')+' · ':'')+'效果 · '+kindNames[value(r,'kind')]}return value(r,'skill_name')||value(r,'unit_name')||value(r,'card_name')||value(r,'display_name')||r.id.split('/').pop().split('.')[0]||'未命名'}
function summary(r){if(r.script.endsWith('/card_effect.gd'))return kindNames[value(r,'kind')]+' · 数值 '+value(r,'amount');if(r.group==='skills')return r.script.split('/').pop().replace('.gd','');if(r.group==='cards')return(value(r,'effects')||[]).map(id=>{let child=index.get(id);return child?kindNames[value(child,'kind')]+' '+value(child,'amount'):''}).join('；');return''}
function matches(r,cat){if(cat==='card_effects')return r.script.endsWith('/card_effect.gd');if(r.id.includes('::'))return false;if(cat==='allies'||cat==='enemies')return r.group==='units'&&value(r,'unit_team')===(cat==='allies'?'team_a':'team_b');return r.group===cat}
function custom(){return data.pending_columns||[]}
function newRows(){return data.pending_rows||[]}
function allChanges(){return data.records.flatMap(r=>r.fields.filter(dirty).map(f=>({r,f})))}
function updateCount(){let n=allChanges().length+custom().length+newRows().length;$('change-count').textContent=n;$('apply').disabled=n===0}
function toast(message){$('toast').textContent=message;$('toast').style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').style.display='none',8500)}
function persist(){try{localStorage.setItem('ballsprite-catalog:'+data.snapshot_id,JSON.stringify(data))}catch(e){toast('草稿保存失败，请立即保存 HTML 文件。')}updateCount()}
function setup(){data.custom_columns=data.custom_columns||[];data.pending_columns=data.pending_columns||[];data.pending_rows=data.pending_rows||[];index=new Map(data.records.map(r=>[r.id,r]));$('stamp').textContent=data.generated.replace('T',' ')+' · '+data.records.length+' 个资源';renderTabs();renderSheet();updateCount()}
function renderTabs(){$('tabs').replaceChildren();for(const cat of Object.keys(titles)){let b=document.createElement('button');b.className=cat===category?'active':'';b.innerHTML=esc(titles[cat])+'<small>'+data.records.filter(r=>matches(r,cat)).length+'</small>';b.onclick=()=>{category=cat;$('search').value='';renderTabs();renderSheet()};$('tabs').append(b)}}
function sheetColumns(){const cols=sheetKeys[category].slice();for(const r of data.records)if(matches(r,category))for(const f of r.fields)if(!cols.includes(f.name))cols.push(f.name);for(const c of [...data.custom_columns,...custom()])if(c.family===family(category)&&!cols.includes(c.name))cols.push(c.name);return cols}
function visibleRows(){let q=$('search').value.trim().toLowerCase();return data.records.filter(r=>matches(r,category)&&[title(r),r.id,summary(r),r.group==='skills'?value(r,'unit_name'):'',...r.fields.map(f=>f.value)].join(' ').toLowerCase().includes(q))}
function displayValue(r,f){if(!f)return'';if(f.hint===2&&f.type===2){f._record=r.id;return enumValue(f)}if(f.type===1)return f.value?'开启':'关闭';if(Array.isArray(f.value))return f.value.map(x=>index.has(x)?title(index.get(x)):x).join('、');if(typeof f.value==='string'&&index.has(f.value))return title(index.get(f.value));return String(f.value??'')}
function fieldHelp(f){return label(f)+' · '+f.name+(f.description?'\n'+f.description:'')}
function parseCell(f,text){if(f.type===1)return text===true||text==='true'||text==='开启';if(f.hint===2&&f.type===2){let option=enumOptions(f).find(([number,name])=>String(number)===String(text).trim()||name===String(text).trim());if(option)return option[0]}if(f.type===2||f.type===3){let n=Number(text);if(String(text).trim()===''||!Number.isFinite(n)||(f.type===2&&!Number.isInteger(n)))throw Error('请输入有效数字');return n}if(f.type===28||f.type===5){let v=JSON.parse(text);if(!Array.isArray(v))throw Error('请填写 JSON 数组');if(f.name==='unlock_upgrade_levels'&&v.some(level=>!Number.isInteger(level)||level<0||level>99))throw Error('解锁强化等级使用 0～99 的整数数组，例如 [0,1]');return v}return String(text)}
function setField(r,f,next){f.value=next;persist();let tr=document.querySelector('tr[data-resource="'+CSS.escape(r.id)+'"]');if(tr)tr.querySelectorAll('td').forEach(td=>{if(td.dataset.field===f.name)td.classList.toggle('changed',dirty(f))})}
function makeCell(r,key,row,col){let td=document.createElement('td');td.dataset.field=key;if(key==='__summary'){td.innerHTML='<div class="readcell">'+esc(summary(r))+'</div>';return td}let f=find(r,key);if(!f){td.innerHTML='<div class="readcell">—</div>';return td}if(dirty(f))td.classList.add('changed');if(!f.editable){let d=document.createElement('div');d.className='readcell';d.textContent=displayValue(r,f);d.title=fieldHelp(f)+'\n'+String(d.textContent);td.append(d);return td}
let input;if(f.hint===2&&f.type===2){input=document.createElement('select');for(const [number,name]of enumOptions(f))input.add(new Option(name,number));input.value=String(f.value)}else if(f.type===1){input=document.createElement('select');input.add(new Option('关闭','false'));input.add(new Option('开启','true'));input.value=String(f.value)}else{input=document.createElement('input');input.value=Array.isArray(f.value)?JSON.stringify(f.value):f.value;input.type=f.type===2||f.type===3?'number':'text';input.step=f.type===2?'1':'any';if(key.includes('description')||key.includes('discription'))input.classList.add('wide')}
input.classList.add('cell');input.dataset.row=String(row);input.dataset.column=String(col);input.dataset.resource=r.id;input.dataset.field=f.name;input.title=fieldHelp(f);
input.onchange=()=>{try{let next=parseCell(f,input.value);setField(r,f,next);input.setCustomValidity('')}catch(e){input.setCustomValidity(e.message);input.reportValidity()}};td.append(input);return td}
function renderSheet(){visible=visibleRows();columns=sheetColumns();$('sheet-title').textContent=titles[category];$('sheet-subtitle').textContent=visible.length+' 行 · '+columns.length+' 列 · 修改过的格子以黄色标记';$('sheet-foot').textContent='每行对应一项资源。文案与实际数值分开保存。双击单元格或按 Tab 切换输入；可从 Excel 粘贴多行、多列。';
let thead=$('sheet-head'),tbody=$('sheet-body');thead.replaceChildren();tbody.replaceChildren();let tr=document.createElement('tr');let th=document.createElement('th');th.className='namecol header';th.textContent='配置项 / 资源路径';tr.append(th);for(const key of columns){th=document.createElement('th');th.textContent=fieldNames[key]||key;const exemplar=visible.find(r=>find(r,key));const f=exemplar?find(exemplar,key):null;if(f){th.textContent=label(f);th.title=fieldHelp(f)}let code=document.createElement('small');code.textContent=key;th.append(code);if(custom().some(c=>c.family===family(category)&&c.name===key)){th.classList.add('newcol');let remove=document.createElement('button');remove.textContent='×';remove.title='移除尚未应用的新字段';remove.onclick=()=>removeColumn(key);th.append(remove)}tr.append(th)}th=document.createElement('th');th.textContent='详情';tr.append(th);thead.append(tr);
visible.forEach((r,row)=>{let tr=document.createElement('tr');tr.dataset.resource=r.id;let name=document.createElement('td');name.className='namecol';name.innerHTML='<div class="namebox"><strong>'+(row+1)+'. '+esc(title(r))+(newRows().some(x=>x.id===r.id)?' · 待创建':'')+'</strong><small title="'+esc(r.id)+'">'+esc(r.id.replace('res://data/',''))+'</small></div>';tr.append(name);columns.forEach((key,col)=>tr.append(makeCell(r,key,row,col)));let action=document.createElement('td');action.className='row-action';let b=document.createElement('button');b.textContent='查看';b.onclick=()=>showDetail(r);action.append(b);if(newRows().some(x=>x.id===r.id)){let remove=document.createElement('button');remove.textContent='移除';remove.onclick=()=>removeRow(r.id);action.append(remove)}tr.append(action);tbody.append(tr)})}
function removeRow(id){data.pending_rows=newRows().filter(x=>x.id!==id);data.records=data.records.filter(r=>r.id!==id);for(const r of data.records){let f=find(r,'effects');if(f&&Array.isArray(f.value)){f.value=f.value.filter(x=>x!==id);f.base=f.base.filter(x=>x!==id)}}index=new Map(data.records.map(r=>[r.id,r]));persist();renderTabs();renderSheet();toast('已移除尚未应用的新配置行')}
function removeColumn(key){const which=custom().find(c=>c.family===family(category)&&c.name===key);if(!which)return;data.pending_columns=custom().filter(c=>c!==which);for(const r of data.records)if((r.script.endsWith('/card_effect.gd')?'card_effects':r.group)===which.family)r.fields=r.fields.filter(f=>f.name!==key);persist();renderSheet();toast('已移除尚未应用的字段列 '+key)}
function showDetail(r){let body=$('modal-body');body.replaceChildren();let h=document.createElement('h2');h.textContent=title(r);body.append(h);let p=document.createElement('div');p.className='hint';p.textContent=summary(r)||'具体机制请查看关联技能或效果。';body.append(p);let x=document.createElement('div');x.className='detail-line pathcell';x.textContent='资源：'+r.id+' · 脚本：'+r.script;body.append(x);for(const f of r.fields){let line=document.createElement('div');line.className='detail-line';line.innerHTML='<strong>'+esc(label(f))+'</strong> <code>'+esc(f.name)+'</code><br>';let refs=Array.isArray(f.value)?f.value:[f.value];if(!f.editable&&refs.some(v=>index.has(v))){for(const ref of refs)if(index.has(ref)){let b=document.createElement('button');b.textContent=title(index.get(ref))+' ↗';b.onclick=()=>{category=index.get(ref).script.endsWith('/card_effect.gd')?'card_effects':index.get(ref).group;renderTabs();renderSheet();$('modal').close();$('search').value='';renderSheet()};line.append(b)}}else{let val=document.createElement('span');val.textContent=displayValue(r,f);line.append(val)}body.append(line)}$('modal').showModal()}
function addRow(){let fam=family(category),templates=data.records.filter(r=>matches(r,category)&&!newRows().some(x=>x.id===r.id));let body=$('modal-body');if(!templates.length){toast('这一类没有可复制的模板行。');return}let options=templates.map(r=>'<option value="'+esc(r.id)+'">'+esc(title(r)+' · '+r.id.replace('res://data/',''))+'</option>').join('');let labelName={cards:'卡牌名称',units:'单位名称',skills:'技能名称',relics:'遗物名称',potions:'药水名称'}[fam]||'名称';let note=fam==='card_effects'?'新效果会加入模板所在卡牌的效果列表；若要给刚创建的新卡加效果，请先应用新卡，再新增效果行。':fam==='units'?'会同时复制单位场景并绑定新单位数据。新单位不会自动加入初始牌组、测试场景或敌人波次。':'会复制模板的数值和资源引用；新配置需要被卡组、场景或玩法引用后才会实际使用。';body.innerHTML='<h2>新增配置行 · '+esc(titles[category])+'</h2><div class="hint warn">'+esc(note)+'</div><div class="formgrid"><label class="full">复制哪一行<select id="row-template">'+options+'</select></label><label>新资源英文标识<input id="row-slug" placeholder="例如 elite_knight"></label>'+(fam==='card_effects'?'':'<label>'+labelName+'<input id="row-label" placeholder="例如 精英骑士"></label>')+'</div><div class="dialog-actions"><button id="confirm-row" class="primary">创建行</button></div>';
$('confirm-row').onclick=()=>{try{let source=$('row-template').value||templates[0].id,template=index.get(source),slug=$('row-slug').value.trim(),display=$('row-label')?.value.trim()||'';if(!template||!templates.includes(template))throw Error('请选择已有的模板行。');if(!/^[a-z][a-z0-9_]{1,49}$/.test(slug))throw Error('英文标识需为 2～50 位小写 snake_case。');let owner=source.split('::')[0],id=fam==='card_effects'?owner+'::Resource_'+slug:'res://data/'+fam+'/'+slug+'.tres';if(index.has(id))throw Error('这个英文标识已存在。');let row=copy(template);row.id=id;row.file=id.split('::')[0];row.used_by=fam==='card_effects'?[owner]:fam==='units'?['res://scenes/units/'+slug+'.tscn']:[];for(const field of row.fields){field.base=copy(field.value);if(field.name==='unit_english_name'||field.name==='id'){field.value=slug;field.base=slug}}let displayField={cards:'card_name',units:'unit_name',skills:'skill_name',relics:'display_name',potions:'display_name'}[fam];if(display&&displayField&&find(row,displayField))find(row,displayField).value=display;data.records.push(row);data.pending_rows.push({family:fam,source,id});index.set(id,row);if(fam==='card_effects'){let parent=index.get(owner),effects=parent&&find(parent,'effects');if(effects){effects.value.push(id);effects.base.push(id)}}$('search').value='';persist();renderTabs();renderSheet();$('modal').close();toast('已新增配置行 '+id+'。编辑数值后点击“一键应用”。')}catch(e){toast('新增配置行失败：'+e.message)}};$('modal').showModal()}
function addColumn(){let fam=family(category);let body=$('modal-body');body.innerHTML='<h2>新增字段列 · '+esc(titles[category])+'</h2><div class="hint warn">会为这一类资源全部增加 Godot 导出字段，并为每一行保存默认值。己方和敌方共用单位数据类型，新增单位字段会出现在两张单位表中。新字段只有被玩法脚本读取后才会改变战斗行为。</div><div class="formgrid"><label>英文配置名<input id="new-name" placeholder="例如 critical_rate"></label><label>中文显示名<input id="new-label" placeholder="例如 暴击率"></label><label>字段类型<select id="new-type"><option value="int">整数</option><option value="float">小数</option><option value="text">文本</option><option value="bool">开关</option></select></label><label>默认值<input id="new-default" value="0"></label><label class="full">说明<textarea id="new-description" placeholder="这个字段代表什么，未来会由哪段玩法逻辑读取"></textarea></label></div><div class="dialog-actions"><button id="confirm-column" class="primary">创建列</button></div>';
$('new-type').onchange=()=>{$('new-default').value={int:'0',float:'0',text:'',bool:'false'}[$('new-type').value]};$('confirm-column').onclick=()=>{try{let name=$('new-name').value.trim(),labelText=$('new-label').value.trim(),dtype=$('new-type').value,raw=$('new-default').value,def;
if(!/^[a-z][a-z0-9_]{1,49}$/.test(name)||!labelText)throw Error('请输入中文名称，以及 2～50 位英文 snake_case 配置名。');if(data.records.some(r=>((r.script.endsWith('/card_effect.gd')?'card_effects':r.group)===fam)&&find(r,name)))throw Error('此字段名已存在。');
if(dtype==='text')def=raw;else if(dtype==='bool'){if(!['true','false'].includes(raw))throw Error('开关默认值只能填 true 或 false。');def=raw==='true'}else{if(raw.trim()===''||!Number.isFinite(Number(raw))||(dtype==='int'&&!Number.isInteger(Number(raw))))throw Error('默认值必须是有效数字。');def=Number(raw)}
let col={family:fam,name,label:labelText,dtype,default:def,description:$('new-description').value.trim()};data.pending_columns.push(col);
const types={bool:1,int:2,float:3,text:4};for(const r of data.records)if((r.script.endsWith('/card_effect.gd')?'card_effects':r.group)===fam)r.fields.push({name,type:types[dtype],hint:0,hint_string:'',editable:true,base:null,value:copy(def),new:true,label:labelText,description:col.description});
persist();renderSheet();$('modal').close();toast('已新增 '+labelText+' 列。请在表中填写各行数值，再点击“一键应用”。')}catch(e){toast('新增字段失败：'+e.message)}};$('modal').showModal()}
function download(name,content,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('search').oninput=renderSheet;$('add-row').onclick=addRow;$('add-column').onclick=addColumn;$('close-modal').onclick=()=>$('modal').close();
$('diff').onclick=()=>{let edits=allChanges();$('modal-body').innerHTML='<h2>待应用的修改</h2><p class="hint">'+newRows().length+' 个新增配置行，'+custom().length+' 个新增字段列，'+edits.length+' 个数据格。应用前会校验并备份。</p><table class="diff-table"><thead><tr><th>资源 / 字段</th><th>原值</th><th>新值</th></tr></thead><tbody>'+newRows().map(x=>'<tr><td>'+esc(x.id)+'</td><td>新增行 · 模板 '+esc(x.source)+'</td><td>创建 Godot 资源</td></tr>').join('')+edits.map(x=>'<tr><td>'+esc(title(x.r))+' · '+esc(label(x.f))+'<br><code>'+esc(x.r.id)+'</code></td><td>'+esc(JSON.stringify(x.f.base))+'</td><td>'+esc(JSON.stringify(x.f.value))+'</td></tr>').join('')+'</tbody></table>';$('modal').showModal()};
$('help').onclick=()=>{$('modal-body').innerHTML='<h2>表格使用说明</h2><p>每个分类是一张表，每行是一项配置，每列是一个字段。黄色格子代表待应用修改。可以从 Excel 复制连续单元格，粘贴进表格。</p><p>“新增配置行”会复制选定模板的数值和关联资源，应用后创建独立资源；单位还会创建对应场景。新资源仍需加入卡组、关卡波次或其他引用，才会在战斗中出现。卡牌效果明细行会加入所属卡牌。</p><p>“新增字段列”可新增文本、整数、小数或开关。应用后会在对应的 GDScript 资源类型中创建导出变量，并在所有该类 .tres 中保存值。字段只有被玩法脚本读取后才会影响战斗。</p><p>本机可点击“一键应用到游戏”。离线 HTML 可编辑并保存，之后将保存的 HTML 交给 Codex 应用。</p>';$('modal').showModal()};
$('save').onclick=()=>{let doc=document.documentElement.cloneNode(true);doc.querySelector('#catalog-data').textContent=JSON.stringify(data).replace(/</g,'\\u003c');doc.querySelector('#modal').removeAttribute('open');doc.querySelector('#toast').style.display='none';download('游戏配置表_已编辑.html','<!doctype html>\n'+doc.outerHTML,'text/html;charset=utf-8');toast('已保存带修改的 HTML 合集。')};
$('export').onclick=()=>download('游戏配置表.json',JSON.stringify(data,null,2),'application/json');
$('import').onclick=()=>$('file-input').click();$('file-input').onchange=async e=>{try{let text=await e.target.files[0].text();if(!text.trim().startsWith('{'))text=new DOMParser().parseFromString(text,'text/html').getElementById('catalog-data').textContent;let next=JSON.parse(text);if(next.format!==data.format||!Array.isArray(next.records))throw Error('合集版本不匹配');data=next;persist();setup();toast('已导入合集，请检查修改后应用。')}catch(error){toast('导入失败：'+error.message)}e.target.value=''};
$('apply').onclick=async()=>{if(!token){toast('请先保存 HTML，再双击 tools/config_catalog/启动配置工具.cmd 并导入文件。');return}let button=$('apply');button.disabled=true;button.textContent='校验并应用中…';try{let response=await fetch('/api/apply',{method:'POST',headers:{'Content-Type':'application/json','X-Catalog-Token':token},body:JSON.stringify(data)}),result=await response.json();if(!response.ok)throw Error(result.error);localStorage.removeItem('ballsprite-catalog:'+data.snapshot_id);data=result.data;setup();toast(result.message+(result.backup?'\n备份：'+result.backup:''))}catch(e){toast('应用失败：'+e.message)}finally{button.textContent='一键应用到游戏';updateCount()}};
document.addEventListener('paste',event=>{let input=event.target;if(!input?.dataset?.resource)return;let text=event.clipboardData?.getData('text/plain')||'';if(!text.includes('\t')&&!text.includes('\n'))return;event.preventDefault();try{let startRow=Number(input.dataset.row),startCol=Number(input.dataset.column),lines=text.replace(/\r/g,'').trimEnd().split('\n').map(line=>line.split('\t')),pending=[];lines.forEach((parts,i)=>parts.forEach((content,j)=>{let r=visible[startRow+i],key=columns[startCol+j],f=r&&find(r,key);if(f?.editable)pending.push([r,f,parseCell(f,content)])}));pending.forEach(([r,f,v])=>f.value=v);persist();renderSheet();toast('已粘贴 '+pending.length+' 个可编辑单元格。')}catch(e){toast('粘贴失败，未修改表格：'+e.message)}});
try{let saved=JSON.parse(localStorage.getItem('ballsprite-catalog:'+data.snapshot_id));if(saved&&saved.format===data.format&&!allChanges().length&&(saved.pending_columns?.length||saved.pending_rows?.length||saved.records.some(r=>r.fields.some(dirty)))){data=saved;toast('已恢复本机编辑草稿。')}}catch(e){}
setup();
if(location.protocol==='http:'&&location.hostname==='127.0.0.1')fetch('/api/session').then(r=>r.json()).then(s=>{token=s.token;$('mode').textContent='已连接本地项目 · 可一键应用并自动备份'}).catch(()=>{});
</script>
</body></html>
